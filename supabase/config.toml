# Local synthetic staging only. Hosted configuration must also be applied in Dashboard.
project_id = "dylan-os-staging"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
jwt_expiry = 900
enable_signup = false
enable_anonymous_sign_ins = false
[auth.email]
enable_signup = false
enable_confirmations = true
[auth.sms]
enable_signup = false
[storage]
enabled = true
file_size_limit = "5MiB"
# No buckets are provisioned. Existing app has no cloud storage UI.
